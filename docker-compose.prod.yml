services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: bookmyslot-web-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:strongredispassword@redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/venues"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker.prod
    container_name: bookmyslot-worker-prod
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:strongredispassword@redis:6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    # Add sensible defaults for memory for PDF generation
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    container_name: bookmyslot-redis-prod
    # Bind to localhost only if exposed
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata-prod:/data
    command: redis-server --requirepass strongredispassword
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "strongredispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redisdata-prod:
